# app-tests-live.yml — zaakafhandelapp caller for the LIVE-NC reusable workflow.
#
# Boots a real, seeded Nextcloud (db + NC + openregister deployed/enabled +
# zaakafhandelapp deployed/enabled), then runs the deep Playwright e2e
# (tests/e2e/workflows/) and/or the Newman API-contract suite against it as
# HARD gates. Generalised per GAP-2 (arm CI live-gating) from openregister's
# reference rig; the reusable tests-live.yml is byte-identical fleet-wide, only
# these inputs differ. Additive — does not touch app-tests.yml / release /
# pre-merge workflows.
#
# Gate status for zaakafhandelapp (see TESTING-CI-ROLLOUT.md for the evidence table):
#   deep-e2e: true  — e2e creates via OR object API by slug 'zaakafhandelapp', run-id-prefixed
#   newman:   true   — ARMED: the collection "0. Setup / Preflight" request resolves the register
#                     numeric id from the stable slug 'zaakafhandelapp' (and addresses the zaak/
#                     taak/klant schemas by slug), so the suite survives a fresh CI boot where the
#                     re-imported register gets a different numeric id.

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    with:
      app-id: zaakafhandelapp
      is-openregister: false
      run-e2e: true
      run-newman: true
      newman-entrypoint: tests/integration/run-newman.sh
