name: Lint Check

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  lint-check:
    runs-on: ubuntu-latest
    # Observed fleet-wide: median 0.6 min, max 1.4 min (n=176). Deliberately loose.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # This job had no setup-node at all, so it inherited the runner's default
      # Node — currently 22, which bundles npm 10. This repo's lockfile is
      # generated by npm 11, and `npm i` under npm 10 would silently RESHAPE it
      # rather than fail — the ephemeral CI copy is thrown away, but the lint
      # would then run against a tree npm 10 resolved, not the one that ships.
      # Node 24 bundles npm 11, and it is also the only line where the .npmrc
      # release-age cooldown exists at all.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm i

      - name: Linting
        run: npm run lint
