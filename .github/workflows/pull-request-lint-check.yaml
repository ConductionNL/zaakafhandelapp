name: Lint Check

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  lint-check:
    runs-on: ubuntu-latest
    # Observed fleet-wide: median 0.6 min, max 1.4 min (n=176). Deliberately loose.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # This job had NO setup-node at all, so it inherited the runner default —
      # currently Node 22, which bundles npm 10. This repo's lockfile is now
      # generated by npm 11, and `npm i` under npm 10 RESHAPES it rather than
      # failing — the CI copy is thrown away, but the lint then runs against a
      # tree npm 10 resolved, not the one that ships. Node 24 bundles npm 11.
      #
      # Nothing in this file named a Node version, so nothing looked wrong.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm i

      - name: Linting
        run: npm run lint
